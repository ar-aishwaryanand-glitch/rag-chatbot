name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-xdist
        pip install -r requirements.txt

    - name: Run unit tests
      env:
        GROQ_API_KEY: test_key_for_ci
        LLM_PROVIDER: groq
        EMBEDDING_PROVIDER: huggingface
        USE_POSTGRES: "false"
        USE_REDIS_QUEUE: "false"
        ENABLE_OBSERVABILITY: "false"
      run: |
        pytest tests/unit -v --tb=short -x

    - name: Run tests with coverage
      env:
        GROQ_API_KEY: test_key_for_ci
        LLM_PROVIDER: groq
        EMBEDDING_PROVIDER: huggingface
        USE_POSTGRES: "false"
        USE_REDIS_QUEUE: "false"
      run: |
        pytest tests/unit --cov=src --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
        verbose: true
      continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install linting tools
      run: |
        pip install ruff

    - name: Run Ruff linter
      run: |
        ruff check src/ tests/ --exit-zero

  type-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install type checking tools
      run: |
        pip install mypy
        pip install -r requirements.txt

    - name: Run type checks
      run: |
        mypy src/ --ignore-missing-imports --no-error-summary || true
      continue-on-error: true

  integration-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, lint]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -r requirements.txt

    - name: Run integration tests
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        LLM_PROVIDER: groq
        EMBEDDING_PROVIDER: huggingface
        USE_POSTGRES: "false"
      run: |
        pytest tests/integration -v --tb=short -m "not slow" || true
      continue-on-error: true
